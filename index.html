<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengundian Lomba</title>
<style>
/* ============ Tokens ============ */
:root {
  color-scheme: light dark;
  --bg: #f2f2f7;
  --card: #ffffff;
  --fill: rgba(120, 120, 128, .12);
  --text: #1c1c1e;
  --muted: #6c6c70;
  --line: rgba(60, 60, 67, .14);
  --accent: #007aff;
  --danger: #ff3b30;
  --glass: rgba(242, 242, 247, .72);
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .06);
  --ease: cubic-bezier(.22, 1, .36, 1);   /* critically damped feel, no overshoot */
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989f;
    --line: rgba(84, 84, 88, .5); --accent: #0a84ff; --glass: rgba(0, 0, 0, .66);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .04);
  }
}

/* ============ Base ============ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { border: 0; background: none; cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }

/* Respond on press, instantly */
.press { transition: transform .12s ease-out, opacity .12s; }
.press:active { transform: scale(.97); opacity: .85; }

/* ============ Top bar (translucent material) ============ */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px max(20px, env(safe-area-inset-right)) 12px max(20px, env(safe-area-inset-left));
  background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  border-bottom: .5px solid var(--line);
}
.brand { font-weight: 600; font-size: 17px; letter-spacing: -.01em; }
.link { color: var(--accent); font-weight: 500; padding: 6px 4px; }
.only-mobile { display: none; }

/* ============ Layout ============ */
.layout {
  display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 28px;
  max-width: 1120px; margin: 0 auto; padding: 24px 20px 48px; align-items: start;
}
.panel {
  position: sticky; top: 76px; padding: 20px;
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
}
.panel h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.02em; display: flex; justify-content: space-between; align-items: center; }
.scrim { display: none; }

/* ============ Segmented control (sliding thumb) ============ */
.seg {
  --n: 2; --i: 0;
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  padding: 2px; border-radius: 10px; background: var(--fill);
}
.seg::before {
  content: ""; position: absolute; top: 2px; bottom: 2px; left: 2px;
  width: calc((100% - 4px) / var(--n)); border-radius: 8px;
  background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .14), 0 0 0 .5px rgba(0, 0, 0, .04);
  transform: translateX(calc(var(--i) * 100%));
  transition: transform .4s var(--ease);
}
@media (prefers-color-scheme: dark) { .seg::before { background: #636366; } }
.seg button { position: relative; padding: 7px 10px; font-weight: 500; font-size: 14px; color: var(--muted); transition: color .2s; }
.seg button[aria-selected="true"] { color: var(--text); }

/* ============ Range rows ============ */
.rows { display: grid; gap: 8px; margin: 16px 0 4px; }
.range { display: flex; align-items: center; gap: 10px; }
.range label { width: 92px; font-weight: 600; color: var(--muted); font-size: 14px; }
.range i { color: var(--muted); font-style: normal; }
.letter {
  width: 52px; height: 44px; text-align: center; text-transform: uppercase;
  font-size: 18px; font-weight: 600; border: 0; border-radius: 12px; background: var(--fill);
  outline: 2px solid transparent; transition: outline-color .15s, background .15s;
}
.letter:focus { outline-color: var(--accent); background: var(--card); }
.letter.bad { outline-color: var(--danger); }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.hint.err { color: var(--danger); }

textarea {
  width: 100%; min-height: 180px; margin-top: 16px; padding: 12px 14px; resize: vertical;
  border: 0; border-radius: 12px; background: var(--fill); line-height: 1.7;
  outline: 2px solid transparent; transition: outline-color .15s;
}
textarea:focus { outline-color: var(--accent); }

.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ============ Switch row ============ */
.switch {
  display: flex; gap: 14px; align-items: center; margin-top: 18px; padding-top: 18px;
  border-top: .5px solid var(--line); cursor: pointer;
}
.switch b { display: block; font-weight: 600; }
.switch small { color: var(--muted); font-size: 13px; line-height: 1.35; display: block; margin-top: 2px; }
.switch input {
  appearance: none; flex: none; width: 51px; height: 31px; margin: 0; border-radius: 99px;
  background: var(--fill); position: relative; cursor: pointer; transition: background .3s var(--ease);
}
.switch input::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); transition: transform .3s var(--ease);
}
.switch input:checked { background: #34c759; }
.switch input:checked::after { transform: translateX(20px); }

/* ============ Stage ============ */
.stage-head { display: grid; gap: 16px; margin-bottom: 24px; }
.tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tools .seg { flex: 1; max-width: 320px; }
.tools .link { white-space: nowrap; }
.title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(30px, 5vw, 40px); line-height: 1.05; letter-spacing: -.03em; font-weight: 700; }
.desc { margin: 6px 0 0; color: var(--muted); }
.primary {
  padding: 13px 28px; border-radius: 99px; background: var(--accent); color: #fff;
  font-weight: 600; font-size: 16px; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
.primary:disabled { opacity: .35; box-shadow: none; cursor: default; }

/* ============ Results ============ */
.empty { padding: 72px 20px; text-align: center; color: var(--muted); border-radius: var(--radius); background: var(--card); box-shadow: var(--shadow); }
.empty big { display: block; font-size: 34px; margin-bottom: 8px; }

.list, .pairs { display: grid; gap: 10px; }
.list  { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.pairs { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.group + .group { margin-top: 28px; }
.group h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

.item {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow); font-weight: 600; font-size: 17px; letter-spacing: -.01em;
}
.num {
  flex: none; min-width: 34px; height: 34px; padding: 0 6px; display: grid; place-items: center;
  border-radius: 10px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent);
  font-size: 14px; font-variant-numeric: tabular-nums;
}
.pair { justify-content: space-between; padding: 18px 20px; }
.pair span:not(.vs) { flex: 1; text-align: center; font-size: 18px; }
.vs { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); background: var(--fill); padding: 4px 9px; border-radius: 99px; }
.bye { justify-content: center; color: var(--muted); font-weight: 500; font-size: 14px; }

/* Plain-text view */
.doc { padding: 6px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }
.doc-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; color: var(--muted); font-size: 13px; }
.doc textarea { margin: 0; min-height: 320px; background: transparent; font: 14px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

.enter > * { animation: in .55s var(--ease) both; animation-delay: calc(min(var(--i), 24) * 45ms); }
@keyframes in { from { opacity: 0; transform: translateY(12px) scale(.98); } }

/* ============ Mobile: panel becomes a bottom sheet ============ */
@media (max-width: 899px) {
  .only-mobile { display: block; }
  .layout { grid-template-columns: 1fr; padding-top: 20px; }
  .panel {
    position: fixed; inset: auto 0 0 0; top: auto; z-index: 40; max-height: 88dvh; overflow: auto;
    border-radius: 26px 26px 0 0; padding-bottom: max(20px, env(safe-area-inset-bottom));
    transform: translateY(104%); visibility: hidden;
    transition: transform .5s var(--ease), visibility 0s .5s;
  }
  .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .4); opacity: 0; pointer-events: none; transition: opacity .4s; }
  body.sheet .panel { transform: none; visibility: visible; transition-delay: 0s; }
  body.sheet .scrim { opacity: 1; pointer-events: auto; }
  .stage-head .seg { max-width: none; }
  .primary { width: 100%; }
}

/* ============ Accessibility preferences ============ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
@media (prefers-reduced-transparency: reduce) {
  .bar { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
</head>
<body>

<header class="bar">
  <span class="brand">Pengundian Lomba</span>
  <button class="link only-mobile press" id="openSheet">Peserta</button>
</header>

<div class="layout">
  <aside class="panel" id="panel" aria-label="Daftar peserta">
    <h2>Peserta <button class="link only-mobile press" id="closeSheet">Selesai</button></h2>

    <div class="seg" id="modeSeg" role="tablist">
      <button role="tab" data-mode="kelas">Kelas</button>
      <button role="tab" data-mode="manual">Manual</button>
    </div>

    <div id="kelasBody">
      <div class="rows" id="ranges"></div>
      <p class="hint" id="hint">Rentang huruf kelas tiap angkatan.</p>
    </div>
    <div id="manualBody" hidden>
      <textarea id="manual" spellcheck="false" placeholder="Satu peserta per baris"></textarea>
    </div>

    <div class="foot">
      <span class="count" id="count"></span>
      <button class="link press" id="reset">Pakai contoh</button>
    </div>

    <label class="switch" id="limitRow" hidden>
      <input type="checkbox" id="limit">
      <span><b>Batasi per angkatan</b><small>Kelas hanya melawan kelas dari angkatan yang sama.</small></span>
    </label>
  </aside>

  <main>
    <div class="stage-head">
      <div class="tools">
        <div class="seg" id="tabSeg" role="tablist">
          <button role="tab" data-tab="urutan">Urutan Tampil</button>
          <button role="tab" data-tab="pairing">Pairing</button>
        </div>
        <button class="link press" id="viewToggle" aria-pressed="false">Lihat teks</button>
      </div>
      <div class="title-row">
        <div>
          <h1 id="title"></h1>
          <p class="desc" id="desc"></p>
        </div>
        <button class="primary press" id="draw">Undi Sekarang</button>
      </div>
    </div>
    <div id="result"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>

<script>
/* ============ Config ============ */
const KEYS = ["X", "XI", "XII"];
const STORE = "pengundian_lomba_v4";
const DEFAULTS = {
  mode: "kelas",
  ranges: { X: ["A", "F"], XI: ["A", "F"], XII: ["A", "G"] },
  manual: "Peserta 1\nPeserta 2\nPeserta 3\nPeserta 4",
  limit: false,
};
const TABS = {
  urutan:  { title: "Urutan Tampil", desc: "Undi urutan penampilan setiap peserta." },
  pairing: { title: "Pairing",       desc: "Undi lawan tanding, dua peserta per babak." },
};

/* ============ State ============ */
const $ = (s) => document.querySelector(s);
const state = load();
const results = { urutan: null, pairing: null };
let tab = "urutan";
let asText = false;

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && typeof saved === "object") return { ...structuredClone(DEFAULTS), ...saved };
  } catch {}
  return structuredClone(DEFAULTS);
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(state)); } catch {} // private mode: just don't persist
}

/* ============ Domain (pure, no DOM) ============ */
const isLetter = (s) => /^[A-Z]$/.test(s);

// ["A","C"] -> ["A","B","C"]; reversed or invalid input is handled, never throws
function span([a, b]) {
  if (!isLetter(a) || !isLetter(b)) return [];
  const [from, to] = [a, b].map((c) => c.charCodeAt(0)).sort((x, y) => x - y);
  return Array.from({ length: to - from + 1 }, (_, i) => String.fromCharCode(from + i));
}

// Participants as groups: [{ label, items }]
function groups() {
  if (state.mode === "manual") {
    const items = state.manual.split("\n").map((s) => s.trim()).filter(Boolean);
    return items.length ? [{ label: "", items }] : [];
  }
  return KEYS
    .map((k) => ({ label: `Angkatan ${k}`, items: span(state.ranges[k]).map((c) => `${k}.${c}`) }))
    .filter((g) => g.items.length);
}

function shuffle(arr) { // Fisher-Yates
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pairUp(items) {
  const s = shuffle(items);
  const pairs = [];
  for (let i = 0; i + 1 < s.length; i += 2) pairs.push([s[i], s[i + 1]]);
  return { pairs, bye: s.length % 2 ? s[s.length - 1] : null };
}

const DRAW = {
  urutan: () => shuffle(groups().flatMap((g) => g.items)),
  pairing: () => {
    const all = groups();
    const split = state.limit && state.mode === "kelas";
    const sets = split ? all : [{ label: "", items: all.flatMap((g) => g.items) }];
    return sets.map((g) => ({ label: g.label, ...pairUp(g.items) }));
  },
};

/* ============ Rendering ============ */
const esc = (s) => Object.assign(document.createElement("i"), { textContent: s }).innerHTML;
const slot = (i) => `style="--i:${i}"`;

const VIEW = {
  urutan: (order) =>
    `<ol class="list" style="list-style:none;margin:0;padding:0">${order.map((c, i) =>
      `<li class="item" ${slot(i)}><span class="num">${i + 1}</span>${esc(c)}</li>`).join("")}</ol>`,

  pairing: (sets) => {
    let n = 0;
    return sets.map((g) => `
      <section class="group">
        ${g.label ? `<h3>${esc(g.label)}</h3>` : ""}
        <div class="pairs">
          ${g.pairs.map(([a, b]) => `<div class="item pair" ${slot(n++)}><span>${esc(a)}</span><span class="vs">VS</span><span>${esc(b)}</span></div>`).join("")}
          ${g.bye ? `<div class="item bye" ${slot(n++)}>${esc(g.bye)} — tidak mendapat lawan (bye)</div>` : ""}
        </div>
      </section>`).join("");
  },
};

// Same results as a plain document, easy to paste into chat or docs
const TEXT = {
  urutan: (order) => ["URUTAN TAMPIL", "", ...order.map((c, i) => `${i + 1}. ${c}`)].join("\n"),

  pairing: (sets) => ["PAIRING", ...sets.flatMap((g) => [
    "",
    ...(g.label ? [g.label, ""] : []),
    ...g.pairs.map(([a, b], i) => `${i + 1}. ${a} vs ${b}`),
    ...(g.bye ? [`${g.bye} — bye (tidak mendapat lawan)`] : []),
  ])].join("\n"),
};

function renderText(data) {
  const text = TEXT[tab](data);
  const rows = text.split("\n").length + 1;
  $("#result").className = "";
  $("#result").innerHTML = `
    <div class="doc">
      <div class="doc-bar"><span>Teks biasa — bisa diedit & disalin</span><button class="link press" id="copy">Salin</button></div>
      <textarea id="plain" rows="${rows}" spellcheck="false">${esc(text)}</textarea>
    </div>`;
}

function renderResult(animate) {
  const out = $("#result");
  const data = results[tab];
  if (!data) {
    const none = !groups().length;
    out.className = "";
    out.innerHTML = `<div class="empty"><big>✦</big>${none
      ? "Belum ada peserta. Isi daftar peserta dulu."
      : "Belum ada undian. Tekan <b>Undi Sekarang</b>."}</div>`;
    return;
  }
  if (asText) return renderText(data);
  out.className = animate ? "enter" : "";
  out.innerHTML = VIEW[tab](data);
}

function renderRanges() {
  $("#ranges").innerHTML = KEYS.map((k) => `
    <div class="range">
      <label>Angkatan ${k}</label>
      <input class="letter" data-k="${k}" data-i="0" maxlength="1" autocomplete="off" aria-label="Dari huruf" placeholder="A" value="${state.ranges[k][0]}">
      <i>–</i>
      <input class="letter" data-k="${k}" data-i="1" maxlength="1" autocomplete="off" aria-label="Sampai huruf" placeholder="Z" value="${state.ranges[k][1]}">
    </div>`).join("");
}

// Cheap syncing of everything that depends on state; call after any change.
function refresh() {
  const kelas = state.mode === "kelas";
  const total = groups().reduce((n, g) => n + g.items.length, 0);

  $("#modeSeg").style.setProperty("--i", kelas ? 0 : 1);
  $("#tabSeg").style.setProperty("--i", tab === "urutan" ? 0 : 1);
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-selected", b.dataset.mode === state.mode));
  document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === tab));

  $("#kelasBody").hidden = !kelas;
  $("#manualBody").hidden = kelas;
  $("#limitRow").hidden = !(kelas && tab === "pairing");
  $("#limit").checked = state.limit;
  $("#count").textContent = `${total} peserta`;
  $("#draw").disabled = total === 0;
  $("#viewToggle").textContent = asText ? "Lihat kartu" : "Lihat teks";
  $("#viewToggle").setAttribute("aria-pressed", asText);
  $("#title").textContent = TABS[tab].title;
  $("#desc").textContent = TABS[tab].desc;

  // Range validation: both letters or neither
  let bad = false;
  document.querySelectorAll(".range").forEach((row) => {
    const [a, b] = [...row.querySelectorAll(".letter")];
    const half = !!a.value !== !!b.value;
    a.classList.toggle("bad", half && !a.value);
    b.classList.toggle("bad", half && !b.value);
    bad ||= half;
  });
  const hint = $("#hint");
  hint.classList.toggle("err", bad);
  hint.textContent = bad ? "Isi kedua huruf, atau kosongkan keduanya." : "Rentang huruf kelas tiap angkatan. Kosongkan untuk melewati.";
}

/* ============ Events ============ */
$("#modeSeg").addEventListener("click", (e) => {
  const m = e.target.closest("[data-mode]")?.dataset.mode;
  if (!m) return;
  state.mode = m; save(); refresh(); renderResult(false);
});

$("#tabSeg").addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]")?.dataset.tab;
  if (!t) return;
  tab = t; refresh(); renderResult(false);
});

$("#ranges").addEventListener("input", (e) => {
  const el = e.target;
  el.value = el.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 1);
  state.ranges[el.dataset.k][el.dataset.i] = el.value;
  save(); refresh();
  if (el.value && el.dataset.i === "0") el.nextElementSibling.nextElementSibling.focus(); // jump to the end box
});

$("#ranges").addEventListener("change", (e) => { // on blur: show reversed ranges the right way round
  const k = e.target.dataset.k;
  const [a, b] = state.ranges[k];
  if (isLetter(a) && isLetter(b) && a > b) {
    state.ranges[k] = [b, a];
    renderRanges(); save(); refresh();
  }
});

$("#manual").addEventListener("input", (e) => { state.manual = e.target.value; save(); refresh(); });
$("#limit").addEventListener("change", (e) => { state.limit = e.target.checked; save(); });

$("#reset").addEventListener("click", () => {
